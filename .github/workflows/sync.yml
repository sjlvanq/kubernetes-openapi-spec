name: "Upstream Directory Sync"
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
 
jobs:
  sync:
    name: "Sync from Remote Source"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Local Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Remote Source
        run: |
          git remote add upstream https://github.com/kubernetes/kubernetes.git
          git fetch upstream master

      - name: Sync Subdirectory to Root
        run: |
          SUBDIR="api/openapi-spec"
          
          git checkout upstream/master -- "$SUBDIR"
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'api' ! -name '.github' -exec rm -rf {} +
          cp -R "$SUBDIR/." .
          rm -rf "api"
 
          sed -i '1i > [!NOTE]\n> Synced from: [kubernetes/api/openapi-spec](https://github.com/kubernetes/kubernetes/tree/master/api/openapi-spec)\n' README.md

          # Stage and commit
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes detected to commit."
          else
            git commit -m "chore: auto-sync from upstream directory ($(date +'%Y-%m-%d'))"
            git push
          fi
